<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <link rel="stylesheet" href="CSS/Styles.css">
</head>

<body>
    <h2>Formulários HTML</h2>
    <!--Primeiro formulário-->
    <!--Atributos do formulário-->
    <form action="register.php" method="post">
        <div>
            <label>Nome:</label>
            <input type="text" />
        </div>
        <!--3- atributo name-->
        <div>
            <!--4- atributo label-->
            <label for="age">Idade:</label>
            <input type="text" name="age" />
        </div>
        <!--6- select-->
        <div>
            <label for="job">Selecione a sua profissão:</label>
            <select name="job">
                <option value="Programador">Programador</option>
                <option value="Tester">Tester/QA</option>
                <option value="Devops">Devops</option>
            </select>
        </div>
        <!--7- atributo selected-->
        <div>
            <label for="contrat">Você leu os termos do contrato?</label>
            <select name="contrat">
                <option value="Sim">Sim</option>
                <option value="Não" selected>Não</option>
            </select>
        </div>
        <!--8- multiplas opções-->
        <div>
            <label for="items">Selecione os intems Desejados:</label>
            <select name="items" multiple>
                <option value="Pera">Pera</option>
                <option value="Feijão">Feijão</option>
                <option value="Arros">Arroz</option>
                <option value="Milho">Milho</option>
            </select>
        </div>
        <!--9- textarea-->
        <div>
            <label for="comment">Escreva a baixo o que você achou do post:</label>
            <textarea name="comment"></textarea>
        </div>
        <!--10- Fieldset e legend-->
        <div>
            <fieldset>
                <legend>Preencha as suas infomações:</legend>
                <label for="firstname">Nome</label>
                <input type="text" name="firstname">
                <label for="lastname">Sobrenome</label>
                <input type="text" name="lastname">
            </fieldset>
        </div>
        <!--11- Datalist-->
        <div>
            <label for="flavor">Esocolha um sabor:</label>
            <input type="text" list="flavors" name="flavor">

            <datalist id="flavors">
                <option value="Cereja"></option>
                <option value="Morango"></option>
                <option value="Abacaxi"></option>
                <option value="Chocolate"></option>
            </datalist>
        </div>
        <!--13- Senha-->
        <div>
            <label for="Password">Digite a sua senha</label>
            <input type="Password" name="Password">
        </div>
        <!--14- raido button-->
        <div>
            <label for="car_model">Escolha o modelo do seu carro</label>
            <div class="radio">
                <input type="radio" value="bmw" name="car_model">
                <label for="bmw">BMW</label>
            </div>
            <div class="radio">
                <input type="radio" value="ferrari" name="car_model">
                <label for="ferrari">Ferrari</label>
            </div>
            <div class="radio">
                <input type="radio" value="renault" name="car_model">
                <label for="renault">Renault</label>
            </div>
        </div>
        <!--15- Checkbox-->
        <div>
            <label for="Optionas">Opcionais do carro:</label>
            <div class="radio">
                <input type="checkbox" name="Optionas[]" value="big_tires">
                <label for="big_tires">Pneus grandes</label>
            </div>
            <div class="radio">
                <input type="checkbox" name="Optionas[]" value="turbo_engine">
                <label for="turbo_engine">Motor turbo</label>
            </div>
            <div class="radio">
                <input type="checkbox" name="Optionas[]" value="hybrid">
                <label for="hybrid">Híbrido</label>
            </div>
        </div>
        <!--16- Input de datas-->
        <div>
            <label for="Birthday">Data de nascimento:</label>
            <input type="date" name="Birthday">
        </div>
        <!--17- Arquivos-->
        <div>
            <label for="imge">Inseira a sua imagem.</label>
            <input type="file" name="imge">
        </div>
        <!--18- numeros-->
        <div>
            <label for="Salary">Qunato você ganha no seu emprego atual:</label>
            <input type="number" name="salary">
        </div>
        <!--19- Input para e-mails-->
        <div>
            <label for="email">Digite o seu e-mail:</label>
            <input type="email" name="email">
        </div>
        <!--20- Value-->
        <div>
            <label for="value">Digite algum valor:</label>
            <input type="text" value="O meu valor é esse" name="value">
        </div>
        <!--21- Atributo disabled-->
        <div>
            <p>Tente mudar o valor:</p>
            <input type="text" value="Não precisa preencher" disabled>
        </div>
        <!--22- Placeholder-->
        <div>
            <label for="correntjob">Digite a sua profissão:</label>
            <input type="text" name="correntjob" placeholder="No que você está trabalhado agora?">
        </div>
        <!--23- Atributo required-->
        <div>
            <label for="Birthyear">Ano de nascimento:</label>
            <input type="text" placeholder="Digite o ano em que você naseu" required>
        </div>
        <!--13- Resetando formulários-->
        <input type="reset" value="Limpar">
        <!--5- envio de form-->
        <input type="submit" value="Enviar" />
    </form>
</body>

</html>
