<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>
    <header class="topo">
        <dev class="container">
            <strong>Newsletter</strong>
            <button id="btnTema" class="btn">Altenar tema 🌓</button>
        </dev>
    </header>

    <main class="container">
        <section class="caixa">
            <h1>Inscreva-se</h1>
            <p>Receba novidades no seu e-mail. Sem Span.</p>

            <form>
                <label for="nome">Nome</label>
                <input type="text" name="nome" id="nome" placeholder="Seu nome">

                <label for="Email">Email</label>
                <input type="text" name="email" id="email" placeholder="nome@gmail.com">

                <button type="submit" class="btn primario">Quero receber</button>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <div class="container">
            <small>Newsletter <span id="ano"></span></small>
        </div>
    </footer>
</body>

</html>
